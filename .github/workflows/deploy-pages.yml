name: 部署 GitHub Pages

# 只有 main 真正更新後才部署；同步 PR 尚未人工合併時不會碰正式站。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包靜態網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
