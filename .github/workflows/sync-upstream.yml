name: 同步 PP 上游

# 只在手動觸發時檢查 pp771007 repo：有更新 → 鏡像 PP 完成品 + 套本地政策補丁 + 重產 manifest/版本 + smoke。
# 全綠只建立同步分支與 PR，絕不直接推 main；人工 review/merge 後才由 deploy-pages.yml 上線。
# 失敗不建立 PR：錨點失效/同步錯誤、或外掛掛點 smoke 紅 → 各開 issue 通知，等人工處理。

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # ── 早退：上游 HEAD 沒變就整包跳過 ──────────────────────────
      #   一定要在 checkout 之前用 ls-remote + raw 檔判斷：stamp 的 BUILD_ID 含時間，
      #   跑了 sync 腳本就必產生位元組變動 → 不早退的話每次觸發都會做白工甚至誤 commit。
      - name: 檢查上游有無更新
        id: chk
        run: |
          UP_SHA=$(git ls-remote https://github.com/pp771007/idle-lineage-class.git refs/heads/main | cut -f1)
          CUR=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/upstream-checkpoint.json" | jq -r '.syncedUpstreamCommit // empty' || true)
          echo "up_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$UP_SHA" ] && [ "$UP_SHA" = "$CUR" ]; then
            echo "上游無更新（$UP_SHA），跳過。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游 $UP_SHA ≠ 已同步 $CUR → 執行同步。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout 本 repo
        if: steps.chk.outputs.changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.chk.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone 新版基準（pp771007）
        if: steps.chk.outputs.changed == 'true'
        id: up
        run: |
          git clone --depth 1 --branch main https://github.com/pp771007/idle-lineage-class.git /tmp/upstream
          echo "sha_short=$(git -C /tmp/upstream rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          VER=$(sed -n "s/.*GAME_VERSION = '\([^']*\)'.*/\1/p" /tmp/upstream/js/00-data.js | head -1); [ -n "$VER" ] || VER='?'
          TITLE=$(sed -n 's/.*<title>\([^<]*\)<\/title>.*/\1/p' /tmp/upstream/index.html | head -1); [ -n "$TITLE" ] || TITLE='放置天堂'
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: 預驗乾淨上游可完整重套核心、外掛與離線補丁
        if: steps.chk.outputs.changed == 'true'
        id: preflight
        continue-on-error: true
        run: node scripts/test-full-sync-preflight.mjs --source-dir /tmp/upstream

      - name: 鏡像資產（assets / public；保留核准的 Shines 回移資產）
        if: steps.chk.outputs.changed == 'true' && steps.preflight.outcome == 'success'
        run: |
          rsync -a --delete --exclude-from=scripts/shines-backport-assets.txt /tmp/upstream/assets/ assets/
          if [ -d /tmp/upstream/public ]; then rsync -a --delete /tmp/upstream/public/ public/; fi

      # 同步內的手機記憶體、PWA、離線整合與 smoke 都需要 Playwright。
      # package-lock 已鎖版；CI 不改寫 package.json。
      - name: 安裝鎖定版依賴與 Playwright Chromium
        if: steps.chk.outputs.changed == 'true' && steps.preflight.outcome == 'success'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: 鏡像 PP 完成品 + 套本地政策 + 重產 manifest/版本 + 更新 checkpoint
        if: steps.chk.outputs.changed == 'true' && steps.preflight.outcome == 'success'
        id: merge
        continue-on-error: true # 失敗（多半是錨點被上游改壞）→ 下面開 issue，不讓整包紅得無聲無息
        env:
          AFK_SKIP_SMOKE: "1" # smoke 拆成獨立 step（失敗要走「開 issue、不推」而非腳本 exit 1）
        run: node scripts/sync-upstream.mjs /tmp/upstream

      - name: 外掛掛點冒煙測試（Playwright）
        if: steps.chk.outputs.changed == 'true' && steps.merge.outcome == 'success'
        id: smoke
        continue-on-error: true
        run: node scripts/smoke-hooks.mjs

      - name: 建立上游同步 PR（全綠才建立；不直推 main）
        if: steps.chk.outputs.changed == 'true' && steps.merge.outcome == 'success' && steps.smoke.outcome == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 白名單 add：只收同步會動到的路徑（npm 產生的 package*.json / node_modules 不進版控）
          git add -A -- index.html js/ css/ assets/ public/ ':(glob)afk-*.js' sw.js version.json anim-manifest.json assets-manifest.json upstream-checkpoint.json wiki-checkpoint.json scripts/apply-shines-backports.mjs scripts/shines-backport-assets.txt
          if git diff --cached --quiet; then
            echo "同步後與現況一致，無需 commit。"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            BASE_BRANCH="sync/upstream-${{ steps.up.outputs.sha_short }}"
            BRANCH="$BASE_BRANCH"
            EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$BASE_BRANCH" --json url --jq '.[0].url // empty')
            if [ -n "$EXISTING" ]; then
              echo "同一上游版本已有待審 PR：$EXISTING"
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              BRANCH="${BASE_BRANCH}-run-${GITHUB_RUN_NUMBER}"
            fi
            git switch -c "$BRANCH"
            git commit -m "chore(sync): 同步 PP ${{ steps.up.outputs.ver }}（${{ steps.up.outputs.sha_short }}）"
            git push -u origin "$BRANCH"

            BODY="$(mktemp)"
            cat > "$BODY" <<'EOF'
          ## 自動同步結果

          此 PR 由「同步 PP 上游」workflow 建立，**不會自動合併或直接部署**。

          已通過：
          - PP 完成品同步與存檔 I/O 契約檢查
          - 舊傭兵獎勵政策、回城免費更新快照、妖精傭兵不限屬性、離線安全與全裝置隱藏來源橫幅
          - Playwright 外掛掛點與離線引擎互斥 smoke

          請人工檢查上游差異與遊戲行為；合併進 `main` 後，GitHub Pages 才會自動部署。
          EOF
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(sync): 同步 PP ${{ steps.up.outputs.ver }}（${{ steps.up.outputs.sha_short }}）" \
              --body-file "$BODY")
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "已建立待審 PR：$PR_URL"
          fi

      - name: 同步失敗（錨點/腳本）→ 開 issue 通知
        if: steps.chk.outputs.changed == 'true' && (steps.preflight.outcome == 'failure' || steps.merge.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "同步腳本失敗 in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "⚠️ 同步腳本失敗（上游 ${{ steps.up.outputs.ver }}），可能是核心補丁錨點被改壞" \
              --body "自動同步在乾淨上游補丁預演或 sync-upstream.mjs 階段失敗。常見原因：①PP 改寫了核心／外掛生命週期／本地政策補丁依賴的錨點；②check-save-io.mjs 擋下存檔 I/O 變更；③手機記憶體、PWA、離線或回移回歸測試未通過。資產不會在預演失敗時先被鏡像，也未建立同步 PR，請依本次 workflow run log 修正。"
          else
            echo "已有開啟中的同名 issue，略過。"
          fi
          exit 1   # 通知後仍維持 workflow 紅燈，不能把「未建立 PR」顯示成成功

      - name: 掛點失效（smoke 紅）→ 開 issue 通知
        if: steps.chk.outputs.changed == 'true' && steps.merge.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "外掛掛點失效 in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "⚠️ PP 更新了（${{ steps.up.outputs.ver }}），但外掛掛點失效，需人工處理" \
              --body "自動同步完成，但 Playwright 冒煙測試發現有外掛沒成功 hook（PP 或其原版核心可能改了 DOM 結構／id）。未建立同步 PR，避免壞版本進入審查與部署。請本機跑 /sync-upstream 並修正失效的外掛掛點，詳見本次 workflow run log。"
          else
            echo "已有開啟中的同名 issue，略過。"
          fi
          exit 1   # 通知後仍維持 workflow 紅燈，不能把「未建立 PR」顯示成成功
